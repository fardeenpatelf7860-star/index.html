<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Civil Engineering Toolkit</title>

<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ffcc">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
}

.container {
    max-width: 600px;
    margin: 40px auto;
    background: #1e1e1e;
    padding: 25px;
    border-radius: 10px;
}

h1, h2 { color: #00ffcc; }

input {
    width: 90%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
    border: none;
    text-align: center;
}

button {
    background: #00ffcc;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
}

footer {
    margin-top: 20px;
    font-size: 13px;
    color: #aaa;
}
</style>
</head>

<body>

<div class="container">

<h1>🏗 Civil Props Calculator</h1>

<label>
  <input type="radio" name="mode" value="lb" checked onclick="toggleMode()"> Length × Width
</label>
<label style="margin-left:15px;">
  <input type="radio" name="mode" value="area" onclick="toggleMode()"> Direct Area
</label>

<div id="lbInputs">
  <input type="number" id="length" placeholder="Length (m)">
  <input type="number" id="width" placeholder="Width (m)">
</div>

<div id="areaInputs" style="display:none;">
  <input type="number" id="area" placeholder="Total Area (m²)">
</div>

<input type="number" id="spacing" placeholder="Spacing (m)">

<button onclick="calculateProps()">Calculate Props</button>

<p id="propsResult"></p>

<hr>

<h2>📐 MS Sheet Calculator (2ft × 3ft)</h2>

<input type="number" id="msLength" placeholder="Slab Length (m)">
<input type="number" id="msWidth" placeholder="Slab Width (m)">

<button onclick="calculateMS()">Calculate Sheets</button>

<p id="msResult"></p>

<hr>

<h2>🏗 Slab Load Calculator</h2>

<input type="number" id="thickness" placeholder="Thickness (mm)">
<input type="number" id="liveLoad" placeholder="Live Load (kN/m²)">

<button onclick="calculateLoad()">Calculate Load</button>

<p id="loadResult"></p>

</div>

<footer>
Designed by <strong>Fardeen Patel</strong> | Version 1.0
</footer>

<script>

function toggleMode() {
  const mode = document.querySelector('input[name="mode"]:checked').value;
  document.getElementById("lbInputs").style.display = (mode === "lb") ? "block" : "none";
  document.getElementById("areaInputs").style.display = (mode === "area") ? "block" : "none";
}

function calculateProps() {
  const spacing = parseFloat(document.getElementById("spacing").value);
  const mode = document.querySelector('input[name="mode"]:checked').value;

  if (!spacing) {
    alert("Enter spacing");
    return;
  }

  let total = 0;

  if (mode === "lb") {
    const L = parseFloat(document.getElementById("length").value);
    const W = parseFloat(document.getElementById("width").value);

    if (!L || !W) {
      alert("Enter length and width");
      return;
    }

    const propsL = Math.floor(L / spacing) + 1;
    const propsW = Math.floor(W / spacing) + 1;
    total = propsL * propsW;

  } else {
    const area = parseFloat(document.getElementById("area").value);

    if (!area) {
      alert("Enter area");
      return;
    }

    total = Math.ceil(area / (spacing * spacing));
  }

  const finalProps = Math.ceil(total * 1.1);
  document.getElementById("propsResult").innerHTML =
    `Estimated Props Required: ${finalProps}`;
}

function calculateMS() {
  const L = parseFloat(document.getElementById("msLength").value);
  const W = parseFloat(document.getElementById("msWidth").value);

  if (!L || !W) {
    alert("Enter slab dimensions");
    return;
  }

  const slabArea = L * W;
  const sheetArea = 0.6096 * 0.9144;

  const sheets = Math.ceil(slabArea / sheetArea);
  const sheetsWithWaste = Math.ceil(sheets * 1.05);

  document.getElementById("msResult").innerHTML =
    `Sheets Required: ${sheetsWithWaste}`;
}

function calculateLoad() {
  const thickness = parseFloat(document.getElementById("thickness").value);
  const liveLoad = parseFloat(document.getElementById("liveLoad").value);

  if (!thickness || !liveLoad) {
    alert("Enter thickness and live load");
    return;
  }

  const selfWeight = (thickness / 1000) * 25;
  const total = selfWeight + liveLoad;

  document.getElementById("loadResult").innerHTML =
    `Total Load: ${total.toFixed(2)} kN/m²`;
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}

</script>

</body>
</html>
