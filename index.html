<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Props & Jacks Calculator</title>

<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ffcc">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
    url('https://images.unsplash.com/photo-1590650153855-d9e808231d41?auto=format&fit=crop&w=1600&q=80');
    background-size: cover;
    background-attachment: fixed;
    color: white;
    text-align: center;
}

.container {
    max-width: 600px;
    margin: 40px auto;
    background: rgba(0,0,0,0.75);
    padding: 25px;
    border-radius: 15px;
}

h1 { color: #00ffcc; }

input {
    width: 90%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    border: none;
    text-align: center;
}

button {
    background: #00ffcc;
    border: none;
    padding: 12px 20px;
    font-size: 18px;
    border-radius: 10px;
    cursor: pointer;
}

table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #444;
    padding: 10px;
}

th {
    background: #00ffcc;
    color: black;
}

#total {
    margin-top: 15px;
    font-size: 20px;
    color: #00ffcc;
    font-weight: bold;
}

footer {
    margin-top: 20px;
    padding: 15px;
    font-size: 14px;
    color: #ccc;
}
</style>
</head>

<body>

<div class="container">
    <h1>🏗 Civil Props / Jacks Calculator</h1>
    <p>1 Meter Grid Rule | Slab Centering Calculation</p>

    <input type="number" id="length" value="12" step="0.1" placeholder="Slab Length (m)">
    <input type="number" id="width" value="8" step="0.1" placeholder="Slab Width (m)">
    <input type="number" id="spacing" value="1" step="0.1" min="0.5" max="1.5" placeholder="Spacing (m)">

    <button onclick="calculate()">Calculate Props 🔊</button>

    <table>
        <thead>
            <tr>
                <th>Direction</th>
                <th>Formula</th>
                <th>Props</th>
            </tr>
        </thead>
        <tbody id="resultBody"></tbody>
    </table>

    <p id="total"></p>
</div>

<footer>
  <hr style="border:1px solid #444;">
  <p>Designed by <strong>Fardeen Patel</strong> | Civil Engineer</p>
  <p>Version 1.0</p>
</footer>

<audio id="clickSound">
    <source src="https://www.soundjay.com/buttons/sounds/button-16.mp3" type="audio/mpeg">
</audio>

<script>
function calculate() {
    document.getElementById("clickSound").play();

    const L = parseFloat(document.getElementById('length').value);
    const W = parseFloat(document.getElementById('width').value);
    const S = parseFloat(document.getElementById('spacing').value);

    if(!L || !W || !S) {
        alert("Enter valid values");
        return;
    }

    const propsL = Math.floor(L / S) + 1;
    const propsW = Math.floor(W / S) + 1;
    const total = propsL * propsW;
    const extra = Math.ceil(total * 1.1);

    document.getElementById('resultBody').innerHTML = `
        <tr><td>Length</td><td>${L}/${S} +1</td><td>${propsL}</td></tr>
        <tr><td>Width</td><td>${W}/${S} +1</td><td>${propsW}</td></tr>
        <tr><td>Total</td><td>${propsL} × ${propsW}</td><td>${total}</td></tr>
        <tr><td>+10% Extra</td><td>${total} × 1.1</td><td>${extra}</td></tr>
    `;

    document.getElementById('total').innerHTML =
        `✅ You Need ${extra} Props/Jacks`;
}

// Service Worker Register
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}

calculate();
</script>

</body>
</html>
