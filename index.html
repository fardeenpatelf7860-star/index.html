<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
    
<title>Advanced Props & Jacks Calculator</title>

<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ffcc">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
    url('https://images.unsplash.com/photo-1590650153855-d9e808231d41?auto=format&fit=crop&w=1600&q=80');
    background-size: cover;
    background-attachment: fixed;
    color: white;
    text-align: center;
}

.container {
    max-width: 600px;
    margin: 40px auto;
    background: rgba(0,0,0,0.75);
    padding: 25px;
    border-radius: 15px;
}

h1, h2 { color: #00ffcc; }

input {
    width: 90%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    border: none;
    text-align: center;
}

button {
    background: #00ffcc;
    border: none;
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 10px;
    cursor: pointer;
}

table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #444;
    padding: 10px;
}

th {
    background: #00ffcc;
    color: black;
}

footer {
    margin-top: 20px;
    padding: 15px;
    font-size: 14px;
    color: #ccc;
}
</style>
</head>

<body>

<div class="container">

    <h1>🏗 Civil Props / Jacks Calculator</h1>

<label>
  <input type="radio" name="mode" value="lb" checked onclick="toggleMode()"> Length × Width
</label>
<label style="margin-left:15px;">
  <input type="radio" name="mode" value="area" onclick="toggleMode()"> Direct Area
</label>

<div id="lbInputs">
  <input type="number" id="length" step="0.1" placeholder="Slab Length (m)">
  <input type="number" id="width" step="0.1" placeholder="Slab Width (m)">
</div>

<div id="areaInputs" style="display:none;">
  <input type="number" id="area" step="0.1" placeholder="Total Area (m²)">
</div>

<input type="number" id="spacing" step="0.1" min="0.5" max="1.5" placeholder="Spacing (m)">

<button onclick="calculate()">Calculate Props</button>

<p id="total" style="margin-top:15px; font-weight:bold;"></p>


<script>

function toggleMode() {
  const mode = document.querySelector('input[name="mode"]:checked').value;

  if (mode === "lb") {
    document.getElementById("lbInputs").style.display = "block";
    document.getElementById("areaInputs").style.display = "none";
  } else {
    document.getElementById("lbInputs").style.display = "none";
    document.getElementById("areaInputs").style.display = "block";
  }
}


function calculate() {
  const spacing = parseFloat(document.getElementById("spacing").value);
  const mode = document.querySelector('input[name="mode"]:checked').value;

  if (!spacing) {
    alert("Enter spacing");
    return;
  }

  let totalProps = 0;

  if (mode === "lb") {
    const L = parseFloat(document.getElementById("length").value);
    const W = parseFloat(document.getElementById("width").value);

    if (!L || !W) {
      alert("Enter length and width");
      return;
    }

    const propsL = Math.floor(L / spacing) + 1;
    const propsW = Math.floor(W / spacing) + 1;

    totalProps = propsL * propsW;

  } else {
    const area = parseFloat(document.getElementById("area").value);

    if (!area) {
      alert("Enter total area");
      return;
    }

    totalProps = Math.ceil(area / (spacing * spacing));
  }

  const finalProps = Math.ceil(totalProps * 1.1);

  document.getElementById("total").innerHTML =
    `Estimated Props Required: ${finalProps}`;
}



// MS Sheet Calculator
function calculateMS() {

    const L = parseFloat(document.getElementById("msLength").value);
    const W = parseFloat(document.getElementById("msWidth").value);

    if (!L || !W) {
        alert("Enter slab dimensions");
        return;
    }

    const slabArea = L * W;

    const sheetLength = 0.6096;  // 2ft in meters
    const sheetWidth = 0.9144;   // 3ft in meters

    const sheetArea = sheetLength * sheetWidth;

    const sheetsRequired = Math.ceil(slabArea / sheetArea);
    const sheetsWithWaste = Math.ceil(sheetsRequired * 1.05);

    document.getElementById("msResult").innerHTML =
        `Slab Area: ${slabArea.toFixed(2)} m² <br>
         Single Sheet Area: ${sheetArea.toFixed(2)} m² <br>
         Sheets Required: ${sheetsRequired} <br>
         +5% Extra: ${sheetsWithWaste}`;
}


// Slab Load Calculator
function calculateLoad() {

    const thicknessMM = parseFloat(document.getElementById("thickness").value);
    const liveLoad = parseFloat(document.getElementById("liveLoad").value);

    if (!thicknessMM || !liveLoad) {
        alert("Enter thickness and live load");
        return;
    }

    const thicknessM = thicknessMM / 1000;

    const selfWeight = thicknessM * 25;

    const totalLoad = selfWeight + liveLoad;

    document.getElementById("loadResult").innerHTML =
        `Self Weight: ${selfWeight.toFixed(2)} kN/m² <br>
         Total Load: ${totalLoad.toFixed(2)} kN/m²`;
}


// Service Worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}



</script>

</body>
</html>
